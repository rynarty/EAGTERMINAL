<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Terminal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="terminal-window">
  <div class="terminal-header">
    <div class="window-buttons">
      <span class="close"></span><span class="minimize"></span><span class="maximize"></span>
    </div>
    <div class="terminal-title">Administrator: EAG Terminal</div>
  </div>
  <div class="terminal" id="terminal">
    <div class="welcome">
      <div>EAG ANOMALIPSE [Version 10.0.22631]</div>
      <div>(c) EAG Corporation. All rights reserved.</div><br>
      <div>EAG TERMINAL v1.0</div>
      <div>Digite <span class="highlight">help</span> para ver os comandos disponíveis.</div><br>
    </div>
    <div class="input-line">
      <span class="prompt">C:\Users\Desconhecido&gt;</span>
      <input type="text" id="commandInput" autocomplete="off" autofocus spellcheck="false">
    </div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
